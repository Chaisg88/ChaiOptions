services:
  - type: web
    name: chai-options
    runtime: node
    plan: free
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ROOT_EMAIL
        value: huatchaisg@gmail.com
      - key: ROOT_PASSWORD
        generateValue: true

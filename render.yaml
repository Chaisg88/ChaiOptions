services:
  - type: web
    name: chai-options
    runtime: node
    plan: starter
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: chai-options-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ROOT_EMAIL
        value: huatchaisg@gmail.com
      - key: ROOT_PASSWORD
        generateValue: true
